name: Refresh listed-corps.json

# 상장사 종목코드 ↔ DART 고유번호 대응표를 매주 갱신해 커밋한다(커밋되면 Vercel 이 자동 재배포).
permissions:
  contents: write

on:
  schedule:
    # 매주 월요일 03:17 KST (= 일요일 18:17 UTC)
    - cron: "17 18 * * 0"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --omit=dev --no-save adm-zip
      - name: Refresh data/listed-corps.json
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/refresh-listed-corps.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/listed-corps.json; then
            echo "변경 없음 — 커밋 생략"
          else
            git add data/listed-corps.json
            git commit -m "chore: listed-corps.json 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
